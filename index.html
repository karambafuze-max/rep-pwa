<title>REP — тренировки</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--text:#111114;--muted:#7b7b82;--line:#e5e5e9;--accent:#4657e8;--danger:#d94848;--r:20px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding:18px 16px 105px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:8px 0 18px}.top h1{margin:0;font-size:32px;letter-spacing:-1px}.sub{font-size:14px;color:var(--muted);margin-top:4px}.grid{display:grid;gap:12px}.card{background:#fff;border:1px solid rgba(0,0,0,.04);border-radius:var(--r);padding:15px;box-shadow:0 8px 24px rgba(0,0,0,.045)}.btn{border:0;border-radius:14px;padding:13px 15px;font-weight:700;background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}.btn.danger{background:#fff;color:var(--danger);box-shadow:inset 0 0 0 1px #f2caca}.btn.small{padding:10px 12px;font-size:13px}.workout{display:flex;align-items:center;justify-content:space-between;gap:12px}.workout h3,.exercise h3{margin:0 0 4px}.muted{color:var(--muted);font-size:13px}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:92px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 12px 28px rgba(70,87,232,.32)}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8a8a92;font-size:11px;padding:7px 2px}.nav button span{display:block;font-size:21px;margin-bottom:3px}.nav button.active{color:var(--accent)}.search{width:100%;border:0;outline:0;background:#eaeaee;border-radius:14px;padding:13px 14px;font-size:16px;margin-bottom:10px}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px}.chip.active{background:#111;color:white;border-color:#111}.exercise{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center}.thumb{width:78px;height:64px;border-radius:14px;background:#fafafa;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.check{width:28px;height:28px;border-radius:50%;border:2px solid #cfcfd5;background:#fff}.check.on{background:var(--accent);border-color:var(--accent);color:#fff}.empty{text-align:center;padding:42px 16px;color:var(--muted)}.empty b{display:block;font-size:38px;margin-bottom:8px}.sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;border-radius:999px;background:#ccc;margin:0 auto 14px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:16px}.setHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.sets{margin-top:10px}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:7px;align-items:center;margin:7px 0}.setrow input{width:100%;padding:10px 8px;text-align:center;border:1px solid var(--line);border-radius:11px;background:#fafafa}.remove{border:0;background:#efeff2;border-radius:10px;height:38px}.link{border:0;background:transparent;color:var(--accent);font-weight:700;padding:4px}.calendarHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendarHead h2{margin:0;font-size:21px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;font-size:11px;color:var(--muted);padding:4px}.day{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.day.today{outline:2px solid var(--accent)}.day .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}.noteTiny{font-size:7px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.colors{display:flex;gap:9px;flex-wrap:wrap}.color{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bbb}.color.sel{box-shadow:0 0 0 3px #111}.hero{background:#fff;border-radius:24px;padding:16px;margin-bottom:12px}.heroPic{height:200px;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center}.hero h2{font-size:25px;margin:12px 0 5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 13px;border-radius:999px;z-index:100;font-size:13px}.errorbox{margin:20px;background:#fff3f3;border:1px solid #f2b9b9;border-radius:16px;padding:16px;color:#8f2323;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app"><div class="app"><div class="top"><div><h1>REP</h1><div class="sub">Загрузка приложения…</div></div></div></div></div>
<script>
(function(){
var EX=[
{id:'hip-thrust',name:'Ягодичный мост / Hip Thrust',group:'Ягодицы',target:'Ягодичные мышцы'},
{id:'rdl',name:'Румынская тяга',group:'Ноги',target:'Ягодицы и задняя поверхность бедра'},
{id:'bulgarian',name:'Болгарские выпады',group:'Ноги',target:'Ягодицы и квадрицепс'},
{id:'abduction',name:'Разведение бёдер сидя',group:'Ягодицы',target:'Средняя ягодичная мышца'},
{id:'adduction',name:'Сведение бёдер сидя',group:'Ноги',target:'Внутренняя поверхность бедра'},
{id:'legpress',name:'Жим ногами',group:'Ноги',target:'Квадрицепс и ягодицы'},
{id:'legcurl',name:'Сгибание ног лёжа',group:'Ноги',target:'Задняя поверхность бедра'},
{id:'legext',name:'Разгибание ног сидя',group:'Ноги',target:'Квадрицепс'},
{id:'latpulldown',name:'Тяга верхнего блока',group:'Спина',target:'Широчайшие мышцы'},
{id:'seatedrow',name:'Тяга горизонтального блока',group:'Спина',target:'Спина'},
{id:'pullup',name:'Подтягивания',group:'Спина',target:'Широчайшие и бицепс'},
{id:'chestpress',name:'Жим от груди в тренажёре',group:'Грудь',target:'Грудные мышцы'},
{id:'shoulderpress',name:'Жим гантелей вверх',group:'Плечи',target:'Дельтовидные мышцы'},
{id:'lateralraise',name:'Разведение гантелей в стороны',group:'Плечи',target:'Средняя дельта'},
{id:'bicepscurl',name:'Сгибание рук с гантелями',group:'Руки',target:'Бицепс'},
{id:'triceps',name:'Разгибание рук на блоке',group:'Руки',target:'Трицепс'},
{id:'cablekick',name:'Отведение ноги назад в кроссовере',group:'Ягодицы',target:'Ягодичные мышцы'},
{id:'plank',name:'Планка',group:'Пресс',target:'Кор и пресс'}];
var COLORS=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#748ffc','#da77f2','#f783ac'];
var state={tab:'workouts',selected:{},filter:'Все',query:'',modal:null,active:null,detail:null,cal:new Date()};
function q(s){return document.querySelector(s)} function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}} function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function workouts(){return get('rep_workouts',[])} function sessions(){return get('rep_sessions',[])} function notes(){return get('rep_notes',{})}
function ex(id){for(var i=0;i<EX.length;i++)if(EX[i].id===id)return EX[i];return null}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function dateFmt(s){return new Date(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function timeFmt(s){return new Date(s).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function svg(id,big){var red='';if(['hip-thrust','rdl','bulgarian','abduction','adduction','legpress','legcurl','legext','cablekick'].indexOf(id)>=0)red='<path d="M108 78h24M110 82l-14 40M130 82l14 40"/>';else if(['latpulldown','seatedrow','pullup'].indexOf(id)>=0)red='<path d="M104 48l16 24 16-24"/>';else if(id==='chestpress')red='<path d="M103 54h34"/>';else if(id==='shoulderpress'||id==='lateralraise')red='<path d="M104 50L90 64M136 50l14 14"/>';else if(id==='bicepscurl'||id==='triceps')red='<path d="M96 68l-8 20M144 68l8 20"/>';else red='<path d="M108 58h24M108 67h24"/>';return '<svg viewBox="0 0 240 150" width="'+(big?320:115)+'" height="'+(big?195:72)+'"><g fill="none" stroke="#aeb1b7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="120" cy="24" r="12" fill="#eef0f3" stroke-width="4"/><path d="M120 38v43M120 52L90 75M120 52l30 23M120 80l-22 43M120 80l23 43"/></g><g fill="none" stroke="#ef5d5d" stroke-width="9" stroke-linecap="round">'+red+'</g><path d="M32 130h176" stroke="#ddd" stroke-width="4"/></svg>'}
function nav(){var a=[['workouts','🏋️','Тренировки'],['exercises','📚','Упражнения'],['calendar','🗓','Календарь'],['history','🕘','История']];return '<nav class="nav">'+a.map(function(x){return '<button data-tab="'+x[0]+'" class="'+(state.tab===x[0]?'active':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')+'</nav>'}
function top(t,s,a){return '<div class="top"><div><h1>'+t+'</h1>'+(s?'<div class="sub">'+s+'</div>':'')+'</div>'+(a||'')+'</div>'}
function render(){try{var html='';if(state.active)html=activeView();else if(state.detail)html=detailView();else if(state.tab==='workouts')html=workoutsView();else if(state.tab==='exercises')html=exercisesView();else if(state.tab==='calendar')html=calendarView();else html=historyView();q('#app').innerHTML='<main class="app">'+html+'</main>'+nav()+(state.modal?modalView():'');bind()}catch(e){q('#app').innerHTML='<div class="errorbox"><b>Ошибка приложения</b>\n'+esc(e && e.stack ? e.stack : e)+'</div>';console.error(e)}}
function workoutsView(){var ws=workouts();var body=ws.length?ws.map(function(w){return '<div class="card workout"><div><h3>'+esc(w.name)+'</h3><div class="muted">'+w.exerciseIds.length+' упражнений</div></div><button class="btn small" data-start="'+w.id+'">Начать</button></div>'}).join(''):'<div class="empty"><b>🏋️</b>Пока нет тренировок.<br>Создай первую из списка упражнений.</div>';return top('Тренировки','Шаблоны можно запускать сколько угодно раз')+'<div class="grid">'+body+'</div><button class="fab" data-create>+</button>'}
function selectedCount(){return Object.keys(state.selected).filter(function(k){return state.selected[k]}).length}
function exercisesView(){var groups=['Все'];EX.forEach(function(e){if(groups.indexOf(e.group)<0)groups.push(e.group)});var list=EX.filter(function(e){return (state.filter==='Все'||e.group===state.filter)&&e.name.toLowerCase().indexOf(state.query.toLowerCase())>=0});var cnt=selectedCount();return top('Упражнения','Выбирай упражнения и собирай свои тренировки',cnt?'<button class="btn small" data-make>'+cnt+' выбрано</button>':'')+'<input class="search" id="search" placeholder="Поиск упражнения" value="'+esc(state.query)+'"><div class="chips">'+groups.map(function(g){return '<button class="chip '+(state.filter===g?'active':'')+'" data-group="'+esc(g)+'">'+esc(g)+'</button>'}).join('')+'</div><div class="grid">'+list.map(function(e){return '<div class="card exercise"><div class="thumb" data-detail="'+e.id+'">'+svg(e.id,false)+'</div><div data-detail="'+e.id+'"><h3>'+esc(e.name)+'</h3><div class="muted">'+esc(e.target)+'</div></div><button class="check '+(state.selected[e.id]?'on':'')+'" data-select="'+e.id+'">'+(state.selected[e.id]?'✓':'')+'</button></div>'}).join('')+'</div>'}
function detailView(){var e=ex(state.detail);var h=sessions().filter(function(s){return s.exercises.some(function(x){return x.exerciseId===e.id})}).reverse().slice(0,5);return '<button class="btn secondary small" data-back>← Назад</button><div class="hero"><div class="heroPic">'+svg(e.id,true)+'</div><h2>'+esc(e.name)+'</h2><div class="muted">'+esc(e.target)+'</div></div><div class="card"><b>Инструкция</b><p style="line-height:1.5">Выполняй движение плавно и контролируемо. Выбирай рабочий вес так, чтобы последние повторения были тяжёлыми, но техника оставалась стабильной.</p></div><div class="sub" style="margin:18px 2px 9px;font-weight:700">ПОСЛЕДНИЕ ЗАПИСИ</div><div class="grid">'+(h.length?h.map(function(s){var x=s.exercises.filter(function(z){return z.exerciseId===e.id})[0];return '<div class="card"><b>'+dateFmt(s.endedAt)+'</b><div class="muted">'+x.sets.map(function(z){return (z.weight||0)+' кг × '+(z.reps||0)}).join(' · ')+'</div></div>'}).join(''):'<div class="empty">Записей пока нет</div>')+'</div><div class="actions"><button class="btn secondary" data-add-detail="'+e.id+'">Добавить в тренировку</button><button class="btn" data-quick="'+e.id+'">Быстрый старт</button></div>'}
function startWorkout(id){var w=workouts().filter(function(x){return x.id===id})[0];state.active={id:uid(),workoutId:w.id,name:w.name,startedAt:new Date().toISOString(),exercises:w.exerciseIds.map(function(id){return {exerciseId:id,sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]}})};render()}
function lastExercise(id){var ss=sessions();for(var i=ss.length-1;i>=0;i--){for(var j=0;j<ss[i].exercises.length;j++)if(ss[i].exercises[j].exerciseId===id)return ss[i].exercises[j]}return null}
function activeView(){var a=state.active;return top(esc(a.name),'Начато '+timeFmt(a.startedAt),'<button class="btn secondary small" data-cancel>Закрыть</button>')+a.exercises.map(function(x,xi){var e=ex(x.exerciseId),last=lastExercise(x.exerciseId);return '<div class="card" style="margin-bottom:12px"><div class="setHead"><div><h3 style="margin:0">'+esc(e.name)+'</h3><div class="muted">'+(last?'Последний раз: '+last.sets.map(function(s){return (s.weight||0)+'×'+(s.reps||0)}).join(' · '):'Первое выполнение')+'</div></div>'+(last?'<button class="link" data-copy="'+xi+'">Скопировать</button>':'')+'</div><div class="sets">'+x.sets.map(function(s,si){return '<div class="setrow"><span class="muted">'+(si+1)+'</span><input inputmode="decimal" placeholder="кг" data-w="'+xi+':'+si+'" value="'+esc(s.weight)+'"><input inputmode="numeric" placeholder="повт." data-r="'+xi+':'+si+'" value="'+esc(s.reps)+'"><button class="remove" data-rem="'+xi+':'+si+'">×</button></div>'}).join('')+'</div><button class="link" data-addset="'+xi+'">+ Добавить подход</button></div>'}).join('')+'<button class="btn" data-finish>Завершить тренировку</button>'}
function historyView(){var ss=sessions().slice().reverse();return top('История','Каждое выполнение сохраняется отдельно')+'<div class="grid">'+(ss.length?ss.map(function(s){var sets=0;s.exercises.forEach(function(e){sets+=e.sets.length});return '<div class="card"><h3 style="margin:0 0 4px">'+esc(s.name)+'</h3><div class="muted">'+dateFmt(s.endedAt)+' · '+timeFmt(s.endedAt)+'</div><div style="margin-top:8px">'+s.exercises.length+' упражнений · '+sets+' подходов</div></div>'}).join(''):'<div class="empty"><b>🕘</b>Завершённые тренировки появятся здесь.</div>')+'</div>'}
function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function calendarView(){var y=state.cal.getFullYear(),m=state.cal.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),ns=notes(),ss=sessions(),cells='';for(var i=0;i<42;i++){var d=i-first+1;if(d<1||d>days){cells+='<div></div>';continue}var k=dateKey(y,m,d),n=ns[k],has=ss.some(function(s){return s.endedAt.slice(0,10)===k}),td=new Date(),today=td.getFullYear()===y&&td.getMonth()===m&&td.getDate()===d;cells+='<button class="day '+(today?'today':'')+'" data-day="'+k+'" style="'+(n?'background:'+n.color+'22;border-color:'+n.color:'')+'"><span>'+d+'</span>'+(has?'<span class="dot"></span>':'')+(n&&n.text?'<span class="noteTiny">'+esc(n.text)+'</span>':'')+'</button>'}var names=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];return top('Календарь','Можно отмечать любые тренировки вручную')+'<div class="card"><div class="calendarHead"><button class="btn secondary small" data-prev>←</button><h2>'+state.cal.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</h2><button class="btn secondary small" data-next>→</button></div><div class="week">'+names.map(function(n){return '<div>'+n+'</div>'}).join('')+'</div><div class="cal">'+cells+'</div></div>'}
function modalView(){if(state.modal.type==='create'){return '<div class="sheetWrap" data-close><div class="sheet" data-sheet><div class="handle"></div><h2>Новая тренировка</h2><div class="field"><label>Название</label><input id="workoutName" placeholder="Например, Ягодицы"></div><button class="btn" data-save-workout>Создать тренировку</button></div></div>'}if(state.modal.type==='calendar'){var n=notes()[state.modal.date]||{text:'',color:COLORS[5]};state.modal.color=state.modal.color||n.color;return '<div class="sheetWrap" data-close><div class="sheet" data-sheet><div class="handle"></div><h2>'+new Date(state.modal.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+'</h2><div class="field"><label>Что было?</label><input id="noteText" value="'+esc(n.text)+'" placeholder="Например, зал или скалодром"></div><div class="field"><label>Цвет</label><div class="colors">'+COLORS.map(function(c){return '<button class="color '+(state.modal.color===c?'sel':'')+'" data-color="'+c+'" style="background:'+c+'"></button>'}).join('')+'</div></div><button class="btn" data-save-note>Сохранить</button><div style="height:8px"></div><button class="btn danger" data-del-note>Очистить отметку</button></div></div>'}return ''}

function bind(){qa('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.getAttribute('data-tab');state.detail=null;render()}});var c=q('[data-create]');if(c)c.onclick=function(){state.tab='exercises';state.selected={};render()};var s=q('#search');if(s)s.oninput=function(){state.query=s.value;render()};qa('[data-group]').forEach(function(b){b.onclick=function(){state.filter=b.getAttribute('data-group');render()}});qa('[data-select]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-select');state.selected[id]=!state.selected[id];render()}});qa('[data-detail]').forEach(function(b){b.onclick=function(){state.detail=b.getAttribute('data-detail');render()}});var mk=q('[data-make]');if(mk)mk.onclick=function(){state.modal={type:'create'};render()};var back=q('[data-back]');if(back)back.onclick=function(){state.detail=null;render()};var sd=q('[data-add-detail]');if(sd)sd.onclick=function(){var id=sd.getAttribute('data-add-detail');state.selected={};state.selected[id]=true;state.detail=null;state.modal={type:'create'};render()};var quick=q('[data-quick]');if(quick)quick.onclick=function(){var id=quick.getAttribute('data-quick');state.active={id:uid(),workoutId:null,name:ex(id).name,startedAt:new Date().toISOString(),exercises:[{exerciseId:id,sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]}]};state.detail=null;render()};qa('[data-start]').forEach(function(b){b.onclick=function(){startWorkout(b.getAttribute('data-start'))}});var savew=q('[data-save-workout]');if(savew)savew.onclick=function(){var name=q('#workoutName').value.trim();if(!name){toast('Введи название');return}var ids=Object.keys(state.selected).filter(function(k){return state.selected[k]});if(!ids.length){toast('Выбери упражнения');return}var ws=workouts();ws.push({id:uid(),name:name,exerciseIds:ids,createdAt:new Date().toISOString()});set('rep_workouts',ws);state.selected={};state.modal=null;state.tab='workouts';render();toast('Тренировка создана')};var close=
