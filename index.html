function detailView(e){var gif=mediaUrl(e.gif_url),img=mediaUrl(e.image);return '<button class="btn secondary small" data-back>← Назад</button><div style="height:10px"></div><div class="hero"><div class="heroPic">'+(gif?'<img src="'+esc(gif)+'" alt="'+esc(nameRu(e))+'" onerror="this.src=\''+esc(img)+'\'">':img?'<img src="'+esc(img)+'" alt="'+esc(nameRu(e))+'">':'🏋️')+'</div><h2>'+esc(nameRu(e))+'</h2><div class="muted">'+esc(e.name||'')+'</div><div class="kv"><div>Группа</div><div>'+esc(bodyRu(e.body_part||e.category))+'</div><div>Цель</div><div>'+esc(targetRu(e.target)||e.target||'—')+'</div><div>Оборудование</div><div>'+esc(equipRu(e.equipment)||'—')+'</div><div>Доп. мышцы</div><div>'+esc(e.muscle_group||((e.secondary_muscles||[]).join(', '))||'—')+'</div></div><h3>Инструкция</h3><div class="instructions">'+esc(safeInstruction(e))+'</div><div class="tiny" style="margin-top:12px">'+esc(e.attribution||'Медиа © Gym visual — https://gymvisual.com/')+'</div><div class="actions"><button class="btn secondary" data-add-detail="'+esc(e.id)+'">В тренировку</button><button class="btn" data-quick="'+esc(e.id)+'">Быстрый старт</button></div></div>'}

function dateKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

function render(){var html='<main class="app">';if(state.active)html+=activeView();else if(state.detail){var e=exerciseById(state.detail);html+=e?detailView(e):'<div class="empty">Упражнение не найдено.</div>'}else if(state.tab==='workouts')html+=workoutsView();else if(state.tab==='exercises')html+=exercisesView();else if(state.tab==='calendar')html+=calendarView();else html+=historyView();html+='</main>';if(!state.active&&!state.detail)html+=nav();if(state.modal&&state.modal.type==='template')html+=createTemplateSheet();if(state.modal&&state.modal.type==='newFromWorkouts')html+=newTemplateFromWorkoutsSheet();if(state.modal&&state.modal.type==='calendar')html+=calendarSheet();q('#app').innerHTML=html;bind()}
function bind(){qa('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.getAttribute('data-tab');state.detail=null;render()}});var r=q('[data-retry]');if(r)r.onclick=function(){state.dbStatus='loading';state.dbMessage='Повторная загрузка базы…';trySources(0)};var s=q('#search');if(s)s.oninput=function(){state.query=s.value;render()};qa('[data-filter]').forEach(function(b){b.onclick=function(){state.filter=b.getAttribute('data-filter');render()}});qa('[data-select]').forEach(function(b){b.onclick=function(e){e.stopPropagation();var id=b.getAttribute('data-select');state.selected[id]=!state.selected[id];render()}});qa('[data-detail]').forEach(function(b){b.onclick=function(){state.detail=b.getAttribute('data-detail');render()}});var back=q('[data-back]');if(back)back.onclick=function(){state.detail=null;render()};var m=q('[data-make-template]');if(m)m.onclick=function(){state.modal={type:'template'};render()};var nt=q('[data-new-template]');if(nt)nt.onclick=function(){state.modal={type:'newFromWorkouts'};render()};var ge=q('[data-go-exercises]');if(ge)ge.onclick=function(){state.modal=null;state.tab='exercises';render()};var close=q('[data-close-sheet]');if(close)close.onclick=function(){state.modal=null;render()};var sheet=q('[data-sheet]');if(sheet)sheet.onclick=function(e){e.stopPropagation()};var saveT=q('[data-save-template]');if(saveT)saveT.onclick=function(){var name=q('#templateName').value.trim();var ids=Object.keys(state.selected).filter(function(k){return state.selected[k]});if(!name){toast('Введи название');return}if(!ids.length){toast('Выбери упражнения');return}var ws=workouts();ws.push({id:uid(),name:name,exerciseIds:ids,createdAt:new Date().toISOString()});set('rep_workouts_v7',ws);state.selected={};state.modal=null;state.tab='workouts';render();toast('Тренировка создана')};var add=q('[data-add-detail]');if(add)add.onclick=function(){var id=add.getAttribute('data-add-detail');state.selected={};state.selected[id]=true;state.detail=null;state.modal={type:'template'};render()};var quick=q('[data-quick]');if(quick)quick.onclick=function(){var id=quick.getAttribute('data-quick'),e=exerciseById(id);state.active={id:uid(),workoutId:null,name:nameRu(e),startedAt:new Date().toISOString(),exercises:[{exerciseId:id,sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}]}]};state.detail=null;render()};qa('[data-start]').forEach(function(b){b.onclick=function(){startWorkout(b.getAttribute('data-start'))}});qa('[data-w]').forEach(function(i){i.oninput=function(){var p=i.getAttribute('data-w').split(':');state.active.exercises[+p[0]].sets[+p[1]].weight=i.value}});qa('[data-r]').forEach(function(i){i.oninput=function(){var p=i.getAttribute('data-r').split(':');state.active.exercises[+p[0]].sets[+p[1]].reps=i.value}});qa('[data-addset]').forEach(function(b){b.onclick=function(){state.active.exercises[+b.getAttribute('data-addset')].sets.push({weight:'',reps:''});render()}});qa('[data-rem]').forEach(function(b){b.onclick=function(){var p=b.getAttribute('data-rem').split(':'),arr=state.active.exercises[+p[0]].sets;arr.splice(+p[1],1);if(!arr.length)arr.push({weight:'',reps:''});render()}});qa('[data-copy]').forEach(function(b){b.onclick=function(){var x=+b.getAttribute('data-copy'),last=lastExercise(state.active.exercises[x].exerciseId);if(last){state.active.exercises[x].sets=last.sets.map(function(s){return {weight:s.weight,reps:s.reps}});render()}}});var cancel=q('[data-cancel]');if(cancel)cancel.onclick=function(){if(confirm('Закрыть тренировку без сохранения?')){state.active=null;render()}};var fin=q('[data-finish]');if(fin)fin.onclick=function(){var a=state.active,sess={id:a.id,workoutId:a.workoutId,name:a.name,startedAt:a.startedAt,endedAt:new Date().toISOString(),exercises:a.exercises.map(function(e){return {exerciseId:e.exerciseId,sets:e.sets.filter(function(z){return String(z.weight).trim()||String(z.reps).trim()})}})};var ss=sessions();ss.push(sess);set('rep_sessions_v7',ss);state.active=null;stat
